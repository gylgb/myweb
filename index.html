<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>贪吃蛇网页版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    background: linear-gradient(160deg,#0f2027,#203a43,#2c5364);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color:#fff;
    display:flex; flex-direction:column; align-items:center;
    touch-action:none; user-select:none;
  }
  .hud {
    width:100%; max-width:420px;
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 8px 6px; font-size:15px;
  }
  .hud span { background:rgba(255,255,255,.12); border-radius:8px; padding:6px 12px; }
  .hud .score { color:#ffd54f; }
  #wrap { position:relative; width:100%; max-width:420px; flex:1; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; background:#0b1217; border-radius:10px; box-shadow:0 6px 24px rgba(0,0,0,.45); }
  #mask {
    position:absolute; inset:0; background:rgba(0,0,0,.62);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:10px; text-align:center; gap:10px;
  }
  #mask h1 { font-size:26px; letter-spacing:2px; }
  #mask p { font-size:14px; color:#bcd; }
  #mask .btn {
    margin-top:6px; padding:12px 40px; border:none; border-radius:24px;
    font-size:17px; color:#123; background:linear-gradient(135deg,#ffd54f,#ffb300);
    font-weight:700; cursor:pointer;
  }
  #mask .controls { font-size:13px; color:#9bb7cc; line-height:1.8; }
  #bottom {
    width:100%; max-width:420px; margin:0 auto; padding:10px 0 22px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  .pad { display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(2,64px); gap:8px; }
  .pad .cell {
    height:64px; border-radius:12px; background:rgba(255,255,255,.12);
    display:flex; align-items:center; justify-content:center;
    font-size:24px; color:#fff;
  }
  .pad .cell:active { background:rgba(255,255,255,.32); }
  .pad .up { grid-column:2; grid-row:1; }
  .pad .left { grid-column:1; grid-row:2; }
  .pad .down { grid-column:2; grid-row:2; }
  .pad .right { grid-column:3; grid-row:2; }
  #pauseBtn {
    width:64px; height:64px; border-radius:12px; border:none;
    background:rgba(77,208,225,.16); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:24px; cursor:pointer;
  }
  #pauseBtn:active { background:rgba(77,208,225,.38); }
</style>
</head>
<body>
  <div class="hud">
    <span>分数 <b class="score" id="score">0</b></span>
    <span>最高 <b class="score" id="best">0</b></span>
    <span id="speedLabel">速度 1</span>
  </div>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="mask">
      <h1>🐍 贪吃蛇</h1>
      <p id="msg">滑动屏幕或按方向键控制</p>
      <button class="btn" id="startBtn">开始游戏</button>
      <div class="controls">
        滑动屏幕转弯<br>
        也可使用下方方向键
      </div>
    </div>
  </div>
  <div id="bottom">
    <button class="pause" id="pauseBtn">⏸</button>
    <div class="pad">
      <div class="cell up">▲</div>
      <div class="cell left">◀</div>
      <div class="cell down">▼</div>
      <div class="cell right">▶</div>
    </div>
  </div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const speedEl = document.getElementById('speedLabel');
  const mask   = document.getElementById('mask');
  const msgEl  = document.getElementById('msg');
  const pauseBtn = document.getElementById('pauseBtn');
  const bestEl = document.getElementById('best');
  let best = parseInt(localStorage.getItem('snakeBest') || '0', 10);
  bestEl.textContent = best;
  const startBtn = document.getElementById('startBtn');

  const GRID = 20;
  let cell, cols, rows;

  function resize(){
    const w = Math.min(window.innerWidth - 16, 420);
    const h = window.innerHeight - 280;
    const side = Math.max(260, Math.min(w, h, 420));
    cell = Math.floor(side / GRID);
    cols = GRID; rows = GRID;
    canvas.width = cell * cols;
    canvas.height = cell * rows;
    draw();
  }

  let snake, dir, nextDir, food, score, speed, timer, running, dead, paused;

  function randFood(){
    let p;
    do {
      p = { x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows) };
    } while (snake.some(s => s.x===p.x && s.y===p.y));
    return p;
  }

  function reset(){
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0}; nextDir = dir;
    food = randFood();
    score = 0; speed = 1; dead = false; paused = false; running = false;
    scoreEl.textContent = score;
    speedEl.textContent = '速度 1';
    pauseBtn.textContent = '⏸';
  }

  function start(){
    reset();
    running = true;
    mask.style.display = 'none';
    clearInterval(timer);
    const base = 210;
    timer = setInterval(tick, Math.max(70, base - (speed-1)*15));
    draw();
  }

  function pauseGame(){
    paused = true;
    clearInterval(timer);
    pauseBtn.textContent = '▶';
    draw();
  }

  function resumeGame(){
    paused = false;
    pauseBtn.textContent = '⏸';
    timer = setInterval(tick, Math.max(70, 210 - (speed-1)*15));
  }

  function togglePause(){
    if (!running || dead) return;
    if (paused) resumeGame();
    else pauseGame();
  }

  function gameOver(msg){
    running = false; dead = true; paused = false;
    clearInterval(timer);
    msgEl.textContent = msg || '游戏结束';
    startBtn.textContent = '再来一局';
    pauseBtn.textContent = '⏸';
    mask.style.display = 'flex';
    draw();
  }

  function tick(){
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= cols || head.y >= rows ||
        snake.some(s => s.x===head.x && s.y===head.y)) {
      return gameOver('撞到了！得分 ' + score);
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      if (score > best) {
        best = score;
        localStorage.setItem('snakeBest', String(best));
        bestEl.textContent = best;
      }
      speed = Math.min(10, 1 + Math.floor(score/100));
      scoreEl.textContent = score;
      speedEl.textContent = '速度 ' + speed;
      food = randFood();
      clearInterval(timer);
      timer = setInterval(tick, Math.max(70, 210 - (speed-1)*15));
    } else {
      snake.pop();
    }
    draw();
  }

  function setDir(x, y){
    if (!running || paused) return;
    if (x === -dir.x && y === -dir.y) return; // 不能掉头
    if (x === dir.x && y === dir.y) return;
    nextDir = {x, y};
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (let x=0;x<cols;x++) for (let y=0;y<rows;y++){
      if ((x+y)%2===0){ ctx.fillStyle='#101a21'; ctx.fillRect(x*cell,y*cell,cell,cell); }
    }
    // food
    ctx.shadowColor = '#ff5252'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#ff1744';
    rround(food.x*cell+2, food.y*cell+2, cell-4, 6);
    ctx.shadowBlur = 0;
    // snake
    snake.forEach((s,i)=>{
      const t = i===0 ? 0 : Math.min(0.9, 1-i/snake.length*0.08);
      ctx.fillStyle = i===0 ? '#4ef560' : 'rgb(' + Math.round(78*t) + ',' + Math.round(245*t-10) + ',' + Math.round(96*(0.4+t*0.3)) + ')';
      rround(s.x*cell+1, s.y*cell+1, cell-2, 7);
    });
    // eyes
    const h = snake[0];
    const ex = h.x*cell, ey = h.y*cell;
    ctx.fillStyle = '#0b1217';
    const cx = cell/2, cy=cell/2;
    const ox = dir.x*cell*0.22, oy = dir.y*cell*0.22;
    [[-1,-1],[1,-1]].forEach(([a,b])=>{
      const px = ex+cx+ox + a*(dir.y!==0?cell*0.2:cell*0.28);
      const py = ey+cy+oy + b*(dir.x!==0?cell*0.2:cell*0.28);
      ctx.beginPath(); ctx.arc(px,py,Math.max(2,cell*0.11),0,Math.PI*2); ctx.fill();
    });
    // 暂停提示
    if (paused) {
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold ' + Math.round(cell*2.2) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('已暂停', canvas.width/2, canvas.height/2);
    }
  }

  function rround(x,y,w,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+w,r);
    ctx.arcTo(x+w,y+w,x,y+w,r);
    ctx.arcTo(x,y+w,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath(); ctx.fill();
  }

  // 滑动控制
  let sx=0, sy=0, onPad=false;
  const pad = document.querySelector('.pad');
  canvas.addEventListener('touchstart', e => { e.preventDefault(); const t=e.touches[0]; sx=t.clientX; sy=t.clientY; }, {passive:false});
  canvas.addEventListener('touchmove', e => { e.preventDefault(); }, {passive:false});
  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx>0?1:-1, 0);
    else setDir(0, dy>0?1:-1);
  }, {passive:false});
  // 鼠标拖拽(桌面调试)
  let mDown=false, mx=0,my=0;
  canvas.addEventListener('mousedown', e => { mDown=true; mx=e.clientX; my=e.clientY; });
  window.addEventListener('mouseup', e => {
    if (!mDown) return; mDown=false;
    const dx=e.clientX-mx, dy=e.clientY-my;
    if (Math.abs(dx)<20 && Math.abs(dy)<20) return;
    if (Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0);
    else setDir(0, dy>0?1:-1);
  });

  // 虚拟方向键
  pad.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.target;
    if (!t.classList.contains('cell')) return;
    if      (t.classList.contains('up'))    setDir(0,-1);
    else if (t.classList.contains('down'))  setDir(0,1);
    else if (t.classList.contains('left'))  setDir(-1,0);
    else if (t.classList.contains('right')) setDir(1,0);
  }, {passive:false});
  // 键盘(桌面)
  window.addEventListener('keydown', e => {
    switch(e.key){
      case 'ArrowUp': case 'w': case 'W': setDir(0,-1); break;
      case 'ArrowDown': case 's': case 'S': setDir(0,1); break;
      case 'ArrowLeft': case 'a': case 'A': setDir(-1,0); break;
      case 'ArrowRight': case 'd': case 'D': setDir(1,0); break;
      case ' ': e.preventDefault(); if(running) togglePause(); else start(); break;
      case 'p': case 'P': togglePause(); break;
    }
  });

  pauseBtn.addEventListener('click', togglePause);
  pauseBtn.addEventListener('touchstart', function(e){ e.preventDefault(); togglePause(); }, {passive:false});

  function handleStart(){ if (running) return; start(); }

  startBtn.addEventListener('click', handleStart);
  startBtn.addEventListener('touchstart', function(e){ e.preventDefault(); handleStart(); }, {passive:false});
  mask.addEventListener('click', handleStart);
  mask.addEventListener('touchstart', function(e){ handleStart(); }, {passive:false});

  window.addEventListener('resize', resize);
  resize();
  draw();
})();
</script>
</body>
</html>
